  .menu{max-width:760px;margin:0 auto}

  .menu button.on{background:#e65100}
  .book{max-width:720px;margin:12px auto;background:#fff;border-radius:24px;
    box-shadow:0 6px 18px rgba(0,0,0,.15);padding:20px}
  .pic{font-size:80px;line-height:1.3;border-radius:20px;padding:14px;
    min-height:120px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px}
  .hintpic{font-size:14px;color:#999;margin-top:4px}
  .em{display:inline-block;cursor:pointer;user-select:none;animation:bob 2.2s ease-in-out infinite}
  .em.jump{animation:jump .6s ease}

  @keyframes jump{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-40px) scale(1.3) rotate(-10deg)}
    70%{transform:translateY(0) scale(.9) rotate(8deg)}100%{transform:translateY(0) scale(1)}}
  .text{font-size:34px;line-height:1.6;margin:16px 0;text-align:left}
  .w{display:inline-flex;align-items:center;margin:4px 3px;vertical-align:middle}
  .z{writing-mode:vertical-rl;text-orientation:upright;font-size:15px;line-height:1;
     color:#d84315;margin-left:2px}
  .t{font-size:15px;color:#d84315;font-weight:bold}
  .t.light{align-self:flex-start}
  .quiz{background:#fff3e0;border-radius:16px;padding:12px 14px;margin:12px 0;text-align:left}
  .q{font-size:26px;margin-bottom:6px}
  .opt{display:block;width:100%;text-align:left;font-size:26px;border:3px solid #ffb74d;
    background:#fff;color:#333;border-radius:16px;padding:6px 14px;margin:8px 0;cursor:pointer}
  .opt.right{background:#c8e6c9;border-color:#4caf50}
  .opt.wrong{background:#ffcdd2;border-color:#e53935}
  .msg{font-size:26px;min-height:40px;font-weight:bold}
  button.nav,#read{font-size:22px;border:0;border-radius:30px;padding:10px 22px;margin:6px;
    background:#ff9800;color:#fff;cursor:pointer}
  button:disabled{background:#ccc!important}
  .page{color:#888;font-size:18px}
  .score{font-size:64px;margin:20px 0}
  .fly{position:fixed;font-size:36px;pointer-events:none;z-index:9;animation:fly 1.4s ease-out forwards}
  @keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.5)}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4) rotate(360deg)}}
</style>
</head>

   text:"巨|ㄐㄩˋ 人|ㄖㄣˊ 追|ㄓㄨㄟ 過|ㄍㄨㄛˋ 來|ㄌㄞˊ ，|， 傑|ㄐㄧㄝˊ 克|ㄎㄜˋ 把|ㄅㄚˇ 大|ㄉㄚˋ 樹|ㄕㄨˋ 砍|ㄎㄢˇ 倒|ㄉㄠˇ ，|， 平|ㄆㄧㄥˊ 安|ㄢ 回|ㄏㄨㄟˊ 家|ㄐㄧㄚ 。|。",
   q:"傑|ㄐㄧㄝˊ 克|ㄎㄜˋ 怎|ㄗㄣˇ 麼|ㄇㄜ˙ 逃|ㄊㄠˊ 走|ㄗㄡˇ ？|？",
   opts:["砍|ㄎㄢˇ 倒|ㄉㄠˇ 大|ㄉㄚˋ 樹|ㄕㄨˋ","坐|ㄗㄨㄛˋ 飛|ㄈㄟ 機|ㄐㄧ","游|ㄧㄡˊ 泳|ㄩㄥˇ"], ans:0 }
]}
];

let b = 0, i = 0;
const state = books.map(bk=>({score:0, answered:bk.pages.map(()=>null)}));
const $ = id => document.getElementById(id);
const TONES = "ˊˇˋ˙";

function toHTML(s){
  return s.split(" ").map(p=>{
    const [c,z]=p.split("|");
    if(!z || z===c) return `<span class="w"><span>${c}</span></span>`;
    let tone="", body=z;
    if(TONES.includes(z.slice(-1))){ tone=z.slice(-1); body=z.slice(0,-1); }
    const t = tone ? `<span class="t ${tone==="˙"?"light":""}">${tone}</span>` : "";
    return `<span class="w"><span>${c}</span>${tone==="˙"?t:""}<span class="z">${body}</span>${tone==="˙"?"":t}</span>`;
  }).join("");
}
function plain(s){ return s.split(" ").map(p=>p.split("|")[0]).join(""); }

function splitEmoji(s){
  if(window.Intl && Intl.Segmenter){
    return [...new Intl.Segmenter("zh",{granularity:"grapheme"}).segment(s)].map(x=>x.segment);
  }
  return Array.from(s);
}
function renderScene(str){
  const pic = $("pic");
  pic.innerHTML = "";
  splitEmoji(str).forEach((ch,n)=>{
    const sp = document.createElement("span");
    sp.className = "em";
    sp.textContent = ch;
    sp.style.animationDelay = (n*0.3)+"s";
    sp.onclick = ()=>{
      sp.classList.remove("jump"); void sp.offsetWidth;
      sp.classList.add("jump");
      setTimeout(()=>sp.classList.remove("jump"),650);
    };
    pic.appendChild(sp);
  });
}
function celebrate(){
  const items = ["🎉","⭐","🌟","✨","💖","🎈"];
  for(let k=0;k<14;k++){
    const e = document.createElement("div");
    e.className = "fly";
    e.textContent = items[k%items.length];
    e.style.left = (30+Math.random()*40)+"vw";
    e.style.top = "55vh";
    e.style.setProperty("--dx",(Math.random()*400-200)+"px");
    e.style.setProperty("--dy",(-100-Math.random()*300)+"px");
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),1500);
  }
}

function renderMenu(){
  $("menu").innerHTML = "";
  books.forEach((bk,idx)=>{
    const btn = document.createElement("button");
    btn.textContent = bk.name;
    if(idx===b) btn.className = "on";
    btn.onclick = ()=>{ b=idx; i=0; renderMenu(); render(); };
    $("menu").appendChild(btn);
  });
}
function render(){
  const bk = books[b], pages = bk.pages, st = state[b];
  if(i===pages.length){ renderResult(); return; }
  const p = pages[i];
  $("pic").style.background = bk.bg;
  renderScene(p.pic);
  $("hintpic").style.display = "";
  $("text").innerHTML = toHTML(p.text);
  $("quiz").style.display = "block";
  $("q").innerHTML = "💭 " + toHTML(p.q);
  $("opts").innerHTML = ""; $("msg").textContent = "";
  p.opts.forEach((o,idx)=>{
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.innerHTML = ["①","②","③"][idx] + " " + toHTML(o);
    btn.onclick = ()=>choose(idx);
    $("opts").appendChild(btn);
  });
  if(st.answered[i]!==null) showAnswer();
  $("page").textContent = `《${bk.name.slice(2)}》第 ${i+1} 頁 / 共 ${pages.length} 頁`;
  $("prev").disabled = i===0;
  $("next").disabled = st.answered[i]===null;
  $("next").textContent = i===pages.length-1 ? "看成績 🏆" : "下一頁 ➡";
  $("read").style.display = "";
}
function choose(idx){
  const st = state[b];
  if(st.answered[i]!==null) return;
  st.answered[i] = idx;
  if(idx===books[b].pages[i].ans){ st.score++; celebrate(); }
  showAnswer();
  $("next").disabled = false;
}
function showAnswer(){
  const p = books[b].pages[i], pick = state[b].answered[i];
  [...$("opts").children].forEach((btn,idx)=>{
    btn.disabled = true;
    if(idx===p.ans) btn.classList.add("right");
    else if(idx===pick) btn.classList.add("wrong");
  });
  $("msg").textContent = pick===p.ans ? "🎉 答對了，你好棒！" : "😊 再看看圖，答案是綠色的喔！";
}
function renderResult(){
  const n = books[b].pages.length, sc = state[b].score;
  renderScene("🏆🌟👑");
  $("hintpic").style.display = "none";
  $("text").innerHTML = `<div class="score">${sc} / ${n}</div>` +
    toHTML("你|ㄋㄧˇ 好|ㄏㄠˇ 棒|ㄅㄤˋ ！|！ 再|ㄗㄞˋ 說|ㄕㄨㄛ 一|ㄧ 次|ㄘˋ 故|ㄍㄨˋ 事|ㄕˋ 給|ㄍㄟˇ 大|ㄉㄚˋ 家|ㄐㄧㄚ 聽|ㄊㄧㄥ 吧|ㄅㄚ˙ ！|！");
  $("quiz").style.display = "none";
  $("read").style.display = "none";
  $("page").textContent = "完成！";
  $("prev").disabled = false;
  $("next").textContent = "重新開始 🔁";
  $("next").disabled = false;
  if(sc===n) celebrate();
}
$("prev").onclick = ()=>{ i--; render(); };
$("next").onclick = ()=>{
  if(i===books[b].pages.length){ state[b]={score:0, answered:books[b].pages.map(()=>null)}; i=0; }
  else i++;
  render();
};
$("read").onclick = ()=>{
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(plain(books[b].pages[i].text));
  u.lang = "zh-TW"; u.rate = 0.8;
  speechSynthesis.speak(u);
};
renderMenu(); render();
</script>
</body>
</html>
